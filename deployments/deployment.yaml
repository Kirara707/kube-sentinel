apiVersion: v1
kind: Namespace
metadata:
  name: kube-sentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-sentinel
  namespace: kube-sentinel
  labels:
    app: kube-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-sentinel
  template:
    metadata:
      labels:
        app: kube-sentinel
    spec:
      serviceAccountName: kube-sentinel
      containers:
        - name: sentinel
          image: kube-sentinel:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: RESTART_THRESHOLD
              value: "3"
            - name: RESYNC_INTERVAL
              value: "30s"
            - name: PROMETHEUS_ENABLED
              value: "false"
            - name: PROMETHEUS_URL
              value: "http://prometheus.monitoring.svc:9090"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["cat", "/tmp/healthy"]
            initialDelaySeconds: 5
            periodSeconds: 10
      restartPolicy: Always
