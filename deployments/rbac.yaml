apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-sentinel
  namespace: kube-sentinel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-sentinel
rules:
  # Pod 监控所需的最小权限
  - apiGroups: [""]
    resources: ["pods", "pods/status", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  # 用于获取集群版本信息
  - apiGroups: [""]
    resources: [""]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-sentinel
subjects:
  - kind: ServiceAccount
    name: kube-sentinel
    namespace: kube-sentinel
roleRef:
  kind: ClusterRole
  name: kube-sentinel
  apiGroup: rbac.authorization.k8s.io
